name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_ACCESS_SECRET: "ci-test-jwt-access-secret-minimum-32-chars-long"
      JWT_REFRESH_SECRET: "ci-test-jwt-refresh-secret-minimum-32-chars-long"
      NODE_ENV: "test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          cd server
          npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "file:./dev.db"
        run: |
          cd server
          npx prisma generate
          npx prisma db push --accept-data-loss

      - name: Seed Database
        env:
          DATABASE_URL: "file:./dev.db"
        run: |
          cd server
          npx tsx prisma/seed.ts

      - name: Run Test Suite
        env:
          DATABASE_URL: "file:./dev.db"
          JWT_ACCESS_SECRET: "ci-test-jwt-access-secret-minimum-32-chars-long"
          JWT_REFRESH_SECRET: "ci-test-jwt-refresh-secret-minimum-32-chars-long"
        run: |
          cd server
          npm test

      - name: Compile TypeScript
        run: |
          cd server
          npm run build
